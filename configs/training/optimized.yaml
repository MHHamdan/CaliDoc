# @package _global_
# Optimized Training Configuration for SOTA Performance

training:
  # More epochs for small datasets (FUNSD has only 149 samples)
  epochs: 50

  # Batch settings - larger effective batch for stability
  batch_size: 8
  gradient_accumulation_steps: 4
  effective_batch_size: 32

  # Optimizer - lower LR for fine-tuning pretrained models
  optimizer:
    name: adamw
    learning_rate: 2e-5  # Lower than 5e-5 for more stable fine-tuning
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1e-8

  # Learning rate scheduler
  scheduler:
    name: cosine
    warmup_ratio: 0.1
    min_lr_ratio: 0.0  # Decay to zero

  # Gradient clipping
  max_grad_norm: 1.0

  # Checkpointing
  save_strategy: epoch
  save_total_limit: 5
  load_best_model_at_end: true
  metric_for_best_model: eval_f1

  # Early stopping - more patience for small datasets
  early_stopping:
    enabled: true
    patience: 10
    threshold: 0.001

  # Loss weights
  losses:
    task_weight: 1.0
    calibration_weight: 0.0
    quality_weight: 0.0
    routing_weight: 0.0

  # Label smoothing for better generalization
  label_smoothing: 0.1

  # Robustness/augmentation settings
  robustness:
    augmentation:
      enabled: false  # Start without augmentation for baseline
      probability: 0.3
