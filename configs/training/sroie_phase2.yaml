# @package _global_
# SROIE Phase 2 training — starts from the CORD recipe per the Phase 2 plan
# (lr 2e-5, 30 epochs, ES patience 5 on val_es, effective batch 32).
# Do not tune without recording a protocol deviation.

training:
  epochs: 30

  batch_size: 8
  gradient_accumulation_steps: 4
  effective_batch_size: 32  # batch_size * gradient_accumulation_steps

  optimizer:
    name: adamw
    learning_rate: 2e-5
    weight_decay: 0.01
    betas: [0.9, 0.999]
    eps: 1e-8

  scheduler:
    name: cosine
    warmup_ratio: 0.1
    min_lr_ratio: 0.01

  max_grad_norm: 1.0

  save_strategy: epoch
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: eval_f1

  # Early stopping reads ONLY the val_es split (train.py enforces this).
  early_stopping:
    enabled: true
    patience: 5
    threshold: 0.001

  losses:
    task_weight: 1.0
    calibration_weight: 0.0
    quality_weight: 0.0
    routing_weight: 0.0

  robustness:
    augmentation:
      enabled: false
      probability: 0.5

  # SLURM requeue support: relative paths resolve under experiment.output_dir.
  resume_from: latest
