# @package _global_
# SROIE Dataset Configuration (Phase 2 addendum, verified bundle)
# ADDENDUM (PENDING PI SIGN-OFF, 2026-07-07): built from the community-standard
# UPSTREAM pre-tagged BIO (darentang/sroie), NOT our own alignment. SROIE failed
# our exact-match gate (94.68/94.02% < 95%); ~5-6% of entity tokens carry upstream
# fuzzy-alignment noise. Report separately from the 3 clean datasets, with caveat.
# See PROVENANCE_sroie_pretagged_addendum_20260707.md.

dataset:
  name: sroie
  task: ner  # Key Information Extraction as token NER

  # Label schema from sroie/processed/label_list.json:
  # 4 fields (company, date, address, total) x B/I + O = 9 BIO labels.
  num_labels: 9

  # Dataset statistics (documents; nominal ICDAR counts)
  stats:
    num_train: 566   # 626 minus 60-doc val_es carve (seed 42)
    num_val_es: 60   # early stopping ONLY, persisted splits/sroie_val_es.json
    num_test: 347
    language: english

  # Processing
  processing:
    max_length: 512
    image_size: [224, 224]

  # Evaluation
  metrics:
    primary: f1
    secondary: [precision, recall]
    evaluation_mode: seqeval
